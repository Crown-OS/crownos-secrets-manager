[package]
name = "crownos-secrets-mcp"
description = "The stdio MCP server that lets agents use CrownOS secrets by name. No tool returns a value"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "crownos-secrets-mcp"
path = "src/main.rs"

[dependencies]
secrets-core = { workspace = true }
secrets-protocol = { workspace = true }

anyhow = { workspace = true }
crownos-ipc = { workspace = true, features = ["tokio"] }
rmcp = { workspace = true, features = ["server", "transport-io"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "macros", "rt", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
