[package]
name = "secrets-proxy"
description = "The HTTPS proxy of crownos-secretsd: it adds API keys to requests for bound hosts and scrubs the responses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
secrets-core = { workspace = true }

base64 = { workspace = true }
bytes = { workspace = true }
getrandom = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pki-types = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "io-util", "sync", "time", "macros"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "rt-multi-thread", "io-util", "sync", "time", "macros"] }


[lints]
workspace = true
