[workspace]
resolver = "3"
members = [
    "crates/secrets-core",
    "crates/secrets-vault",
    "crates/secrets-protocol",
    "crates/secrets-proxy",
    "crates/secrets-run",
    "crates/daemon",
    "crates/cli",
    "crates/mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crown-os/crownos-secrets-manager"

[workspace.dependencies]
secrets-core = { path = "crates/secrets-core" }
secrets-vault = { path = "crates/secrets-vault" }
secrets-protocol = { path = "crates/secrets-protocol" }
secrets-proxy = { path = "crates/secrets-proxy" }
secrets-run = { path = "crates/secrets-run" }
crownos-ipc = { path = "../crownos-ipc" }

anyhow = "1.0.100"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.3", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
  "std",
] }
clap = { version = "4.6", features = ["derive"] }
rmcp = { version = "3.10", default-features = false }
base64 = "0.22"
rustix = { version = "1", default-features = false, features = ["std", "fs", "pipe", "process", "event"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
getrandom = "0.3"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
secrecy = "0.10.3"
zeroize = "1.8"
region = "3.0.2"
rpassword = "7.4"
dirs = "6"
proptest = "1.11"
hyper = { version = "1.6", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.10", features = ["tokio"] }
http-body-util = "0.1.3"
bytes = "1.10"
http = "1.3"
rustls = { version = "0.23.20", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.1", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1.11"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
redundant_clone = "deny"
large_enum_variant = "warn"
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
cast_possible_truncation = "warn"
cast_lossless = "warn"
missing_const_for_fn = "warn"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
